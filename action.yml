name: 'Run tests'
description: 'Runs dotnet test using target frameworks appropriate for the current platform'
inputs:
  reset-script:
    description: 'pwsh expression to be run between test runs to reset infrastructure, if required. Only used when max-parallel is 1; ignored (with a warning) when max-parallel > 1.'
    required: false
  framework:
    description: Specifies the target framework to run tests for
    required: false
  report-warnings:
    description: Specifies whether to report warnings for tests that have neither failed nor succeeded (i.e. skipped or inconclusive)
    required: false
  target-platform:
    description: Specifies the RunConfiguration.TargetPlatform for dotnet test. Defaults to 'x64'.
    required: false
    default: x64
  projects:
    description: >-
      Optional newline- or semicolon-delimited list of project paths to run instead of
      auto-discovering test projects. When provided, project discovery is
      skipped and only the listed projects are tested. When absent, today's
      discovery behavior (all *.csproj under src/ referencing
      Microsoft.NET.Test.Sdk) is preserved.
    required: false
  max-parallel:
    description: >-
      Maximum number of `dotnet test` processes to run concurrently. Defaults
      to 1 (sequential), which preserves the historic behavior. Values greater
      than 1 enable parallel execution with buffered, per-run output replay,
      and disable reset-script.
    required: false
    default: '1'
runs:
  using: "composite"
  steps:
    - id: setup
      name: Setup
      shell: pwsh
      env:
        RESET_SCRIPT: ${{ inputs.reset-script }}
      run: |
        $script = $Env:RESET_SCRIPT
        if (-not ([string]::IsNullOrEmpty($script))) {
          echo $Env:RESET_SCRIPT > ${{ github.action_path }}/reset-script.ps1
          echo "has-reset-script=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        }
    - name: Run tests
      shell: pwsh
      env:
        RESET_SCRIPT: ${{ github.action_path }}/reset-script.ps1
        HAS_RESET_SCRIPT: ${{ steps.setup.outputs.has-reset-script }}
        EXPLICIT_TEST_FRAMEWORK: ${{ inputs.framework }}
        REPORT_WARNINGS: ${{ inputs.report-warnings }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        TEST_FILTER: ${{ inputs.filter }}
        TEST_PROJECTS: ${{ inputs.projects }}
        MAX_PARALLEL: ${{ inputs.max-parallel }}
      run: ${{ github.action_path }}/run-tests.ps1
    # Each run's output is buffered and only replayed once that run finishes, so a run that was still
    # going when the job was cancelled or timed out would otherwise leave nothing behind.
    - name: Show output of unfinished test runs
      if: always()
      shell: pwsh
      run: |
        Get-ChildItem (Join-Path $Env:RUNNER_TEMP 'run-tests-action') -File -ErrorAction SilentlyContinue | Where-Object Length -gt 0 | ForEach-Object {
          Write-Output "::group::Unfinished: $($_.Name)"
          Get-Content $_.FullName
          Write-Output '::endgroup::'
        }
