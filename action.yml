name: 'Run tests'
description: 'Runs dotnet test using target frameworks appropriate for the current platform'
inputs:
  reset-script:
    description: 'pwsh expression to be run between test runs to reset infrastructure, if required. Only used when max-parallel is 1; ignored (with a warning) when max-parallel > 1.'
    required: false
  framework:
    description: Specifies the target framework to run tests for
    required: false
  report-warnings:
    description: Specifies whether to report warnings for tests that have neither failed nor succeeded (i.e. skipped or inconclusive)
    required: false
  target-platform:
    description: Specifies the RunConfiguration.TargetPlatform for dotnet test. Defaults to 'x64'.
    required: false
    default: x64
  projects:
    description: >-
      Optional newline- or semicolon-delimited list of project paths to run instead of
      auto-discovering test projects. When provided, project discovery is
      skipped and only the listed projects are tested. When absent, today's
      discovery behavior (all *.csproj under src/ referencing
      Microsoft.NET.Test.Sdk) is preserved.
    required: false
  max-parallel:
    description: >-
      Maximum number of `dotnet test` processes to run concurrently. Defaults
      to 1 (sequential), which preserves the historic behavior. Values greater
      than 1 enable parallel execution with buffered, per-run output replay,
      and disable reset-script. Use `auto` to match the number of CPUs on the
      runner.
    required: false
    default: '1'
  cache-timings:
    description: >-
      Only used when max-parallel is not 1. Stores how long each test run took
      in the GitHub Actions cache and uses it on later runs to start the
      slowest runs first instead of ordering alphabetically. Set to 'false'
      to always order alphabetically.
    required: false
    default: 'true'
  timings-cache-key:
    description: >-
      Optional extra text mixed into the timings cache key. Only needed when
      jobs that share a workflow, job id, runner OS, projects and framework
      run different tests, for example matrix legs that differ only by an
      environment variable.
    required: false
runs:
  using: "composite"
  steps:
    - id: setup
      name: Setup
      shell: pwsh
      env:
        RESET_SCRIPT: ${{ inputs.reset-script }}
        TIMINGS_KEY_PARTS: ${{ github.workflow }}|${{ github.job }}|${{ inputs.projects }}|${{ inputs.framework }}|${{ inputs.target-platform }}|${{ inputs.timings-cache-key }}
      run: |
        $script = $Env:RESET_SCRIPT
        if (-not ([string]::IsNullOrEmpty($script))) {
          echo $Env:RESET_SCRIPT > ${{ github.action_path }}/reset-script.ps1
          echo "has-reset-script=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        }

        # Cache keys are limited in length and characters, so the identifying parts are hashed.
        $bytes = [Text.Encoding]::UTF8.GetBytes($Env:TIMINGS_KEY_PARTS)
        $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).Substring(0, 16).ToLowerInvariant()
        echo "timings-key=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        echo "timings-directory=$(Join-Path $Env:RUNNER_TEMP 'run-tests-action-timings')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
    - name: Restore test run timings
      if: inputs.max-parallel != '1' && inputs.cache-timings != 'false'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.setup.outputs.timings-directory }}
        key: run-tests-timings-v1-${{ runner.os }}-${{ steps.setup.outputs.timings-key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          run-tests-timings-v1-${{ runner.os }}-${{ steps.setup.outputs.timings-key }}-
    - id: run-tests
      name: Run tests
      shell: pwsh
      env:
        RESET_SCRIPT: ${{ github.action_path }}/reset-script.ps1
        HAS_RESET_SCRIPT: ${{ steps.setup.outputs.has-reset-script }}
        EXPLICIT_TEST_FRAMEWORK: ${{ inputs.framework }}
        REPORT_WARNINGS: ${{ inputs.report-warnings }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        TEST_FILTER: ${{ inputs.filter }}
        TEST_PROJECTS: ${{ inputs.projects }}
        MAX_PARALLEL: ${{ inputs.max-parallel }}
        TIMINGS_FILE: ${{ inputs.cache-timings != 'false' && format('{0}/timings.json', steps.setup.outputs.timings-directory) || '' }}
      run: ${{ github.action_path }}/run-tests.ps1
    - name: Save test run timings
      if: always() && inputs.max-parallel != '1' && inputs.cache-timings != 'false' && steps.run-tests.outputs.timings-updated == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.setup.outputs.timings-directory }}
        key: run-tests-timings-v1-${{ runner.os }}-${{ steps.setup.outputs.timings-key }}-${{ github.run_id }}-${{ github.run_attempt }}
    # Each run's output is buffered and only replayed once that run finishes, so a run that was still
    # going when the job was cancelled or timed out would otherwise leave nothing behind.
    - name: Show output of unfinished test runs
      if: always()
      shell: pwsh
      run: |
        Get-ChildItem (Join-Path $Env:RUNNER_TEMP 'run-tests-action') -File -ErrorAction SilentlyContinue | Where-Object Length -gt 0 | ForEach-Object {
          Write-Output "::group::Unfinished: $($_.Name)"
          Get-Content $_.FullName
          Write-Output '::endgroup::'
        }
